name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows 走纯 Go（CGO=0，已验证通过）；linux 的 systray/FUSE 需要 cgo
          # （linux-arm64 桌面端不在支持范围：README 为 Windows/macOS/NAS-Docker；
          #   arm64 走 NAS Docker 镜像，见 docker job）
          - target: windows
            arch: amd64
            os: windows-latest
            cgo: "0"
          - target: windows
            arch: arm64
            os: windows-latest
            cgo: "0"
          - target: linux
            arch: amd64
            os: ubuntu-latest
            cgo: "1"
            cc: gcc
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # build-dist.sh 打包需要 zip/unzip；linux 的 systray/FUSE 需要 cgo，
      # 装 gcc/gtk/fuse/ayatana 头；arm64 交叉编译需 aarch64 gcc
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zip unzip gcc gcc-aarch64-linux-gnu libgtk-3-dev libfuse-dev libayatana-appindicator3-dev

      - name: Build dist
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          CC: ${{ matrix.cc }}
        run: bash scripts/build-dist.sh ${{ matrix.target }} ${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asuan-${{ matrix.target }}-${{ matrix.arch }}
          # windows runner 无 zip 命令，build-dist.sh 会回退为 tar.gz，两者都上传
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # 只下载 asuan-* 发行产物；排除 docker job 的 buildx 缓存 artifact
          # （suantea~asuan-keeper~*.dockerbuild，默认下载全部时会拉取它并失败）
          pattern: asuan-*
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true

  docker:
    name: Docker Hub (asuan-hub)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # GitHub Actions 不允许在 job/step 的 if 里引用 secrets 上下文，
    # 因此先把 secrets 注入 env，再在步骤级用 env 守卫：
    # 未配置 Docker Hub secrets 时跳过登录与推送（不阻塞 release）。
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          VERSION="latest"
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="$GITHUB_REF_NAME"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          # Dockerfile 里 COPY cmd/internal/go.mod 引用仓库根目录文件，
          # 因此 context 必须指向仓库根，file 单独指向 deploy/hub/Dockerfile。
          context: .
          file: ./deploy/hub/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            suantea/asuan-hub:latest
            suantea/asuan-hub:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

