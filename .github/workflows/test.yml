name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: go build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Linux 上编译 systray（tray 包）需要 GTK/appindicator 头文件。
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      # 不带 -tags cgofuse：占位符虚拟层走 stub（fs_nofuse.go），
      # 保证在没有 FUSE 头文件的环境上 build/test 全绿；
      # 带 FUSE 的真实构建由 release.yml（-tags cgofuse）覆盖。
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
