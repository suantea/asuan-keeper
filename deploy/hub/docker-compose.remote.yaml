# asuan-keeper NAS 常驻节点部署（拉取 Docker Hub 镜像版）
#
# 用法:
#   1. 本目录放好 asuan.json（复制 asuan.example.json 修改）
#   2. docker compose up -d
#   3. 浏览器打开 http://<NAS>:18084 进入网页控制台
#
# 镜像: suantea/asuan-keeper（Docker Hub，tag: latest / vX.Y.Z）
# 本地源码构建版见 docker-compose.yml（build: .）
services:
  hub:
    image: suantea/asuan-keeper:latest
    container_name: asuan-keeper
    restart: unless-stopped
    # host 网络：syncthing 监听端口直接暴露到 LAN（端口由 asuan.json 的 stealth.tcp_port 决定，
    # 不固定映射，符合隐蔽要求）；GUI 绑 loopback 仅容器内可访问，内置网页控制台绑 0.0.0.0
    # 供局域网 http://NAS:18084 访问。
    network_mode: host
    volumes:
      # 读写挂载：内置网页控制台可直接保存配置。
      - ./asuan.json:/etc/asuan/asuan.json
      - ./syncthing-config:/var/syncthing/config
      - ./data:/var/syncthing
      - ./files:/sync
    environment:
      - STNOUPGRADE=1
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
