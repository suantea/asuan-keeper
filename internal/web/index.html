<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>asuan 控制台</title>
<style>
  :root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--panel2:#1c232d;--line:#2a323d;--text:#dbe3ec;--muted:#8b98a7;--green:#3fb950;--yellow:#d29922;--red:#f85149;--blue:#58a6ff;--cyan:#39c5cf}
  *{box-sizing:border-box;margin:0}
  body{font:14px/1.55 system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding:20px;max-width:1100px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:20px;font-weight:600;letter-spacing:.02em}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500}
  .badge.on{background:rgba(63,185,80,.12);color:var(--green);border:1px solid rgba(63,185,80,.35)}
  .badge.off{background:rgba(248,81,73,.12);color:var(--red);border:1px solid rgba(248,81,73,.35)}
  .sub{color:var(--muted);font-size:12px;margin-bottom:18px}
  .mono{font-family:ui-monospace,Consolas,"Courier New",monospace}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .card .k{color:var(--muted);font-size:12px;margin-bottom:4px}
  .card .v{font-size:20px;font-weight:600}
  .card .v.green{color:var(--green)}.card .v.yellow{color:var(--yellow)}.card .v.red{color:var(--red)}.card .v.blue{color:var(--blue)}
  h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:24px 0 10px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  th{color:var(--muted);font-weight:500;background:var(--panel2)}
  td.path{max-width:360px;overflow:hidden;text-overflow:ellipsis}
  td.id-cell{font-size:11px;color:var(--muted)}
  .pill{padding:2px 9px;border-radius:10px;font-size:12px}
  .pill.idle,.pill.clean{background:rgba(63,185,80,.12);color:var(--green)}
  .pill.syncing{background:rgba(88,166,255,.14);color:var(--blue)}
  .pill.waiting{background:rgba(210,153,34,.14);color:var(--yellow)}
  .pill.error{background:rgba(248,81,73,.14);color:var(--red)}
  .peer-on{color:var(--green)}.peer-off{color:var(--red)}
  .bar{width:110px;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
  .bar>span{display:block;height:100%;background:var(--blue)}
  .bar.done>span{background:var(--green)}
  .num{font-variant-numeric:tabular-nums}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px;transition:filter .1s}
  button:hover{filter:brightness(1.2)}
  button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.small{padding:3px 10px;font-size:12px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .grow{flex:1}
  textarea{width:100%;height:360px;background:#0b0f14;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;font:12.5px/1.5 ui-monospace,Consolas,monospace;white-space:pre;resize:vertical}
  .idbox{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
  .copybtn{padding:3px 8px;font-size:11px}
  #toast{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:13px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:320px}
  #toast.ok{border-color:rgba(63,185,80,.5)}#toast.err{border-color:rgba(248,81,73,.5)}
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>

<header>
  <h1>asuan</h1>
  <span class="badge off" id="runbadge"><span class="dot"></span><span id="runtext">停止</span></span>
  <span class="sub mono" id="ver"></span>
  <span class="grow"></span>
  <button id="refresh" title="立即刷新">刷新</button>
</header>
<div class="sub" id="myid"></div>

<div class="cards">
  <div class="card"><div class="k">同步状态</div><div class="v" id="cstate">–</div></div>
  <div class="card"><div class="k">文件夹</div><div class="v" id="cfolders">–</div></div>
  <div class="card"><div class="k">在线对端</div><div class="v" id="cpeers">–</div></div>
  <div class="card"><div class="k">待同步文件</div><div class="v" id="cneed">–</div></div>
  <div class="card"><div class="k">设备 ID</div><div class="v mono" style="font-size:13px" id="cid">–</div></div>
</div>

<h2>同步文件夹</h2>
<div class="panel">
  <table>
    <thead><tr><th>名称</th><th>路径</th><th>状态</th><th>全局</th><th>本地</th><th>进度</th><th>操作</th></tr></thead>
    <tbody id="folders"><tr><td colspan="7" style="color:var(--muted)">加载中…</td></tr></tbody>
  </table>
</div>

<h2>对端设备</h2>
<div class="panel">
  <table>
    <thead><tr><th>名称</th><th>设备 ID</th><th>连接</th><th>地址</th></tr></thead>
    <tbody id="peers"><tr><td colspan="4" style="color:var(--muted)">加载中…</td></tr></tbody>
  </table>
</div>

<h2>配置</h2>
<div class="row">
  <button id="load" class="primary">编辑当前配置</button>
  <button id="save" disabled>保存并重载</button>
  <button id="reload">仅重载引擎</button>
  <span class="sub" id="cfgmeta" style="margin:0">点击「编辑当前配置」后可直接修改 JSON</span>
</div>
<textarea id="cfg" spellcheck="false" placeholder="（加载后在此编辑 asuan.json 配置）"></textarea>
<div class="sub" id="err" style="margin-top:8px;color:var(--red)"></div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let data = null;

function fmt(n){ n=Number(n)||0; return n>=10000 ? n.toLocaleString('zh-CN') : String(n); }
function size(n){ n=Number(n)||0;
  if(n>=1e9) return (n/1e9).toFixed(2)+' GB';
  if(n>=1e6) return (n/1e6).toFixed(1)+' MB';
  if(n>=1e3) return (n/1e3).toFixed(0)+' KB';
  return n+' B';
}
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function statePill(s){
  s=(s||'').toLowerCase();
  const map={idle:['idle','空闲'],scanning:['syncing','扫描中'],syncing:['syncing','同步中'],syncpreparing:['syncing','准备中'],clean:['idle','已同步'],waiting:['waiting','等待'],syncwaiting:['waiting','排队'],error:['error','异常']};
  const m=map[s]||['waiting',s||'未知'];
  return `<span class="pill ${m[0]}">${m[1]}</span>`;
}
function toast(msg,type){
  const t=$('toast'); t.textContent=msg; t.className=type||'';
  t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2800);
}
async function getJSON(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function post(url,body){
  const r=await fetch(url,{method:'POST',headers:body?{'Content-Type':'application/json'}:undefined,body:body||undefined});
  let d; try{ d=await r.json(); }catch(e){ d={ok:false,error:'HTTP '+r.status}; }
  return d;
}

async function status(){
  try{
    data=await getJSON('/api/status');
  }catch(e){
    toast('获取状态失败：'+e.message,'err'); return;
  }
  const on=!!data.running;
  $('runbadge').className='badge '+(on?'on':'off');
  $('runtext').textContent=on?'运行中':'停止';
  $('ver').textContent=on?('syncthing '+data.version):'';
  $('myid').textContent=on?('本机设备 ID：'+data.myID):'';
  $('cid').textContent=data.myID||'–';

  const fs=data.folders||[];
  const need=fs.reduce((a,f)=>a+(Number(f.needFiles)||0),0);
  const states=fs.map(f=>(f.state||'').toLowerCase());
  const busy=states.some(s=>s==='syncing'||s==='scanning'||s==='syncpreparing');
  const bad=states.some(s=>s==='error');
  const cs=$('cstate');
  cs.textContent=bad?'异常':(busy?'同步中':(fs.length?'已同步':'未配置'));
  cs.className='v '+(bad?'red':(busy?'blue':'green'));
  $('cfolders').textContent=fmt(fs.length); $('cfolders').className='v blue';
  const peers=(data.peers||[]);
  const online=peers.filter(p=>p.Connected).length;
  $('cpeers').textContent=online+'/'+peers.length;
  $('cpeers').className='v '+(online>0?'green':'yellow');
  $('cneed').textContent=fmt(need); $('cneed').className='v '+(need>0?'yellow':'green');

  $('folders').innerHTML=fs.length?fs.map(f=>{
    const total=Number(f.globalTotalItems)||0, local=Number(f.localTotalItems)||0;
    const pct=total>0?Math.round(100*local/total):(Number(f.globalFiles)>0?100:0);
    const done=pct>=100;
    const relBtn=f.released
      ?`<button class="small" onclick="act('hydrate',${JSON.stringify(f.id)})" title="从对端重新拉回全部内容">水合</button>`
      :`<button class="small" onclick="act('release',${JSON.stringify(f.id)})" title="删除本地实体不传播，对端保留">释放</button>`;
    const pathBtn=f.released
      ?`<button class="small" onclick="actPath('hydrate',${JSON.stringify(f.id)})" title="按相对路径水合（如 sub/file.txt）">按路径水合</button>`
      :`<button class="small" onclick="actPath('release',${JSON.stringify(f.id)})" title="按相对路径释放（如 sub/file.txt，仅删该路径）">按路径释放</button>`;
    const relPill=f.released?` <span class="pill waiting" title="已释放：本地实体已删，对端保留">已释放</span>`:'';
    return `<tr>
      <td>${esc(f.label||f.id||'')}${relPill}</td>
      <td class="path" title="${esc(f.path||'')}">${esc(f.path||'')}</td>
      <td>${statePill(f.state)}</td>
      <td class="num">${fmt(total)} · ${size(f.globalBytes)}</td>
      <td class="num">${fmt(local)} · ${size(f.localBytes)}</td>
      <td><span class="bar ${done?'done':''}"><span style="width:${pct}%"></span></span> <span class="num" style="font-size:12px;color:var(--muted)">${pct}%${need>0?' · '+fmt(need)+' 待':''}</span></td>
      <td>${relBtn} ${pathBtn}</td>
    </tr>`;
  }).join(''):`<tr><td colspan="7" style="color:var(--muted)">尚无同步文件夹，请在配置中添加 folders</td></tr>`;

  $('peers').innerHTML=peers.length?peers.map(p=>`<tr>
    <td>${esc(p.name||'')}</td>
    <td class="id-cell">${esc(p.device_id||'')}</td>
    <td><span class="${p.connected?'peer-on':'peer-off'}">${p.connected?'● 在线':'○ 离线'}</span></td>
    <td class="id-cell">${esc(p.address||'—')}</td>
  </tr>`).join(''):`<tr><td colspan="4" style="color:var(--muted)">尚未配置对端设备</td></tr>`;
}
function enableSave(){
  $('save').disabled=false;
  $('cfgmeta').textContent='已修改，点击「保存并重载」生效';
}
$('load').onclick=async function(){
  try{
    const c=await getJSON('/api/config');
    $('cfg').value=JSON.stringify(c,null,2);
    $('cfgmeta').textContent='配置已加载（JSON 格式，保存后自动重载引擎）';
    $('save').disabled=true;
    toast('配置已加载','ok');
  }catch(e){ toast('读取配置失败：'+e.message,'err'); }
};
$('save').onclick=async function(){
  let v; try{ v=JSON.parse($('cfg').value); }catch(e){ $('err').textContent='JSON 格式错误：'+e.message; return; }
  $('err').textContent=''; $('save').disabled=true; $('save').textContent='保存中…';
  const d=await post('/api/config',JSON.stringify(v,null,2));
  $('save').textContent='保存并重载';
  if(d.ok){ toast('已保存并重载引擎','ok'); setTimeout(status,1500); }
  else{ $('save').disabled=false; toast('保存失败：'+(d.error||''),'err'); }
};
$('reload').onclick=async function(){
  $('reload').disabled=true; $('reload').textContent='重载中…';
  const d=await post('/api/reload');
  $('reload').disabled=false; $('reload').textContent='仅重载引擎';
  if(d.ok){ toast('引擎已重载','ok'); setTimeout(status,1500); }
  else toast('重载失败：'+(d.error||''),'err');
};
$('refresh').onclick=status;
$('cfg').addEventListener('input',enableSave);

// 释放/水合操作（占位符）。hydrate 会等待对端拉回，期间禁用按钮。
async function act(kind,folder){
  const verb=kind==='release'?'释放':'水合';
  if(!confirm(`确定${verb}文件夹「${folder}」？\n\n释放：删除本地实体不传播，对端内容保留，本地空间释放。\n水合：从对端重新拉回全部内容。`)) return;
  const d=await post('/api/'+kind,JSON.stringify({folder}));
  if(d.ok){ toast(`${verb}成功`, 'ok'); setTimeout(status,1500); }
  else toast(`${verb}失败：${d.error||''}`,'err');
}

// 按相对路径释放/水合单文件或子目录（空路径=整个文件夹）。
async function actPath(kind,folder){
  const verb=kind==='release'?'释放':'水合';
  const rel=prompt(`输入要${verb}的相对路径（如 sub/file.txt；目录名也可以；留空=整个文件夹）：`);
  if(rel===null) return; // 用户取消
  const p=rel.trim();
  if(p && !confirm(`确定按路径${verb}「${p}」？\n\n释放：仅删除该路径本地实体，不传播，对端保留。\n水合：从对端重新拉回该路径。`)) return;
  const d=await post('/api/'+kind,JSON.stringify({folder,relpath:p}));
  if(d.ok){ toast(`${verb}成功`, 'ok'); setTimeout(status,1500); }
  else toast(`${verb}失败：${d.error||''}`,'err');
}

status(); setInterval(status,3000);
</script>
