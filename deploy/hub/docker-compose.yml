services:
  hub:
    # Dockerfile 内 COPY 路径相对仓库根，build context 必须是仓库根
    # （本文件位于 deploy/hub/，上两级即仓库根）。
    build:
      context: ../..
      dockerfile: deploy/hub/Dockerfile
    container_name: asuan-keeper
    restart: unless-stopped
    # host 网络：syncthing 监听端口直接暴露到 LAN（端口由 asuan.json 的 stealth.tcp_port 决定，
    # 不固定映射，符合隐蔽要求）；GUI 绑 loopback 仅容器内可访问，内置网页控制台绑 0.0.0.0
    # 供局域网 http://NAS:18084 访问。
    network_mode: host
    volumes:
      # 读写挂载：内置网页控制台可直接保存配置。
      - ./asuan.json:/etc/asuan/asuan.json
      - ./syncthing-config:/var/syncthing/config
      - ./data:/var/syncthing
      - ./files:/sync
    environment:
      - STNOUPGRADE=1
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
